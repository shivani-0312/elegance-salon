<!-- salon/templates/salon/password_reset_form.html -->
{% extends "salon/base.html" %}

{% block content %}
<div style="max-width: 400px; margin: auto; text-align: center;">

    <h2>Reset Password</h2>

    <!-- Show Success -->
    {% if success_message %}
        <p style="color: green; font-weight: bold;">{{ success_message }}</p>
        <button onclick="window.history.back()" 
                style="background: gray; color: white; padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer;">
            ← Back
        </button>

    <!-- Show Form if not successful -->
    {% else %}
        {% if error_message %}
            <p style="color: red;">{{ error_message }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" 
                    style="background: blue; color: white; padding: 8px 20px; border: none; cursor: pointer;">
                Reset Password
            </button>
        </form>

        <br>
        <button onclick="window.history.back()" 
                style="background: gray; color: white; padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer;">
            ← Back
        </button>
    {% endif %}

</div>
{% endblock %}
